# Builds the extension zip on every push/PR.
# On a version tag (v1.2.3) it also creates a GitHub release with the zip attached,
# and, if the Chrome Web Store credentials are configured, uploads and publishes it.
#
# Release flow: bump "version" in src/manifest.json, commit, then
#   git tag v1.2.3 && git push --tags

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      zip: ${{ steps.meta.outputs.zip }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Syntax-check scripts
        run: for f in src/*.js; do node --check "$f"; done

      - name: Read and validate manifest
        id: meta
        run: |
          version=$(node -p "require('./src/manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=viewport-search-$version.zip" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p dist
          cd src && zip -r -X "../dist/${{ steps.meta.outputs.zip }}" . -x '.*'

      - uses: actions/upload-artifact@v7
        with:
          name: viewport-search-${{ steps.meta.outputs.version }}
          path: dist/${{ steps.meta.outputs.zip }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: viewport-search-${{ needs.build.outputs.version }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ needs.build.outputs.zip }}" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  publish:
    needs: build
    # Runs only once the CWS_EXTENSION_ID repository variable is set (after the first manual upload).
    if: startsWith(github.ref, 'refs/tags/v') && vars.CWS_EXTENSION_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: viewport-search-${{ needs.build.outputs.version }}

      - name: Upload and publish to Chrome Web Store
        env:
          EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: |
          set -euo pipefail
          token=$(curl -sf https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" -d grant_type=refresh_token | jq -r .access_token)

          upload=$(curl -s -X PUT -T "$ZIP" \
            -H "Authorization: Bearer $token" -H "x-goog-api-version: 2" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$EXTENSION_ID")
          echo "$upload"
          [[ $(jq -r .uploadState <<<"$upload") == SUCCESS ]] || { echo "::error::Upload failed"; exit 1; }

          publish=$(curl -s -X POST -H "Content-Length: 0" \
            -H "Authorization: Bearer $token" -H "x-goog-api-version: 2" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID/publish")
          echo "$publish"
          jq -e '.status | index("OK")' <<<"$publish" >/dev/null || { echo "::error::Publish failed"; exit 1; }
